<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Munir's Mixtapes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Press+Start+2P&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/sunset.css">
    <link rel="stylesheet" href="styles/tapes.css">
</head>

<body class="theme-sunset">
    <div class="screen-overlay"></div>
    <div class="container tape-page-container">

        <header class="header page-header-tapes">
            <h1 class="main-title">MUNIR'S MIXTAPES</h1>
            <p class="instruction-text" style="margin-bottom: 5px;">Music composed by me in Garageband.</p>
            <p class="instruction-text">Tap a cassette to start playing!</p>
        </header>

        <!-- The Boombox Player -->
        <div class="boombox-player pixel-box" id="boombox-player">
            <div class="boombox-screen">
                <div class="scrolling-text" id="now-playing-text">NO TAPE INSERTED</div>
            </div>
            <div class="boombox-controls">
                <button id="btn-prev" class="boombox-btn" disabled title="Previous Tape">⏮</button>
                <button id="btn-play-pause" class="boombox-btn" disabled title="Play/Pause">▶</button>
                <button id="btn-next" class="boombox-btn" disabled title="Next Tape">⏭</button>
                <button id="btn-loop" class="boombox-btn" disabled title="Toggle Loop">🔁</button>
            </div>
            <div class="progress-bar-container" id="progress-container" style="cursor: pointer; position: relative;">
                <div class="progress-bar-fill" id="progress-bar"></div>
            </div>
            <div class="audio-timer" id="audio-timer" style="font-family: var(--font-retro); font-size: 0.6rem; color: #8fce00; text-align: right; width: 100%; max-width: 400px; margin-top: 4px; text-shadow: 0 0 5px rgba(143, 206, 0, 0.5);">0:00 / 0:00</div>
        </div>

        <!-- The Cassette Shelf -->
        <main class="cassette-shelf" id="cassette-shelf">
            <!-- Tapes injected by JS -->
        </main>

        <footer class="footer">
            <p>&copy; 2026 Munir Paviwala</p>
        </footer>
    </div>

    <!-- Audio element -->
    <audio id="audio-player"></audio>

    <script src="js/tapes-data.js"></script>
    <script src="js/tapes.js"></script>
</body>

</html>
