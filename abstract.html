<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pentatonic Color Board</title>
    <!-- Use a modern sleek font for this specific exhibit -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/pentatonic-color-board.css">
</head>
<body>

    <div class="help-btn" id="help-btn" title="Information">?</div>
    <div class="info-panel" id="info-panel" style="opacity: 0; pointer-events: none; transition: opacity 0.3s ease;">
        <h1>Pentatonic Color Board</h1>
        <p>Click patterns to start their rhythmic loops.</p>
        <p>Have fun playing!</p>
    </div>

    <!-- The overlay that creates the darkness and the flashlight hole -->
    <div id="flashlight-overlay"></div>

    <div id="discovery-canvas">
        <!-- Grid items generated by JS -->
    </div>

    <script>
        const basePalette = [
            '16171a', '7f0622', 'd62411', 'ff8426', 'ffd100', 'fafdff',
            'ff80a4', 'ff2674', '94216a', '430067', '234975', '68aed4',
            'bfff3c', '10d275', '007899', '002859', 'ffd100'
        ];

        // Shuffle palette randomly on load
        function getShuffledPalette() {
            return [...basePalette].sort(() => Math.random() - 0.5);
        }
        
        function hexToRgb(hex) {
            const r = parseInt(hex.substring(0, 2), 16);
            const g = parseInt(hex.substring(2, 4), 16);
            const b = parseInt(hex.substring(4, 6), 16);
            return {r, g, b};
        }
        
        function generateUniqueShade(hexCode) {
            let {r, g, b} = hexToRgb(hexCode);
            // Jitter the color slightly to make unique shades
            const vary = () => Math.floor(Math.random() * 51) - 25; // +/- 25
            const clamp = (val) => Math.max(0, Math.min(255, val));
            return `rgb(${clamp(r + vary())}, ${clamp(g + vary())}, ${clamp(b + vary())})`;
        }
        
        // Pentatonic scale notes (C major pentatonic: C, D, E, G, A in various octaves for depth)
        const scale = [
            130.81, 146.83, 164.81, 196.00, 220.00, // C3 to A3
            261.63, 293.66, 329.63, 392.00, 440.00, // C4 to A4
            523.25, 587.33, 659.25                  // C5 to E5
        ];

        const canvas = document.getElementById('discovery-canvas');
        const overlay = document.getElementById('flashlight-overlay');
        
        // Audio Context (created on first interaction)
        let audioCtx;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playNote(frequency, profile) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            osc.type = profile.type; 
            osc.frequency.value = frequency * profile.octave;

            gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
            // Clean, sweeping chord tone
            gainNode.gain.linearRampToValueAtTime(0.12, audioCtx.currentTime + 0.1); 
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 3.0); 
            
            osc.start();
            osc.stop(audioCtx.currentTime + 3.5); 

            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
        }

        // Help button logic
        const helpBtn = document.getElementById('help-btn');
        const infoPanel = document.getElementById('info-panel');
        helpBtn.addEventListener('click', () => {
            const isHidden = infoPanel.style.opacity === '0';
            infoPanel.style.opacity = isHidden ? '1' : '0';
            infoPanel.style.pointerEvents = isHidden ? 'auto' : 'none';
        });

        // Polyrhythmic Settings
        const BPM = 120;
        const beatDurationMs = (60 / BPM) * 1000;
        const possibleBeatMultipliers = [1, 2, 3, 4]; // Restoring tight, overlapping loops
        
        // Track active keys grouped by their color family
        const colorActiveKeys = {};
        const MAX_PER_COLOR = 3; // Enforce distinct harmony limits
        
        // Synth mapping for each color family in the user's palette
        const synthProfiles = {
            '16171a': { type: 'triangle', octave: 0.5 }, // Deep dark - sub bass
            '7f0622': { type: 'triangle', octave: 0.5 }, // Dark red - gritty bass
            'd62411': { type: 'triangle', octave: 1 },   // Bright red - mid 
            'ff8426': { type: 'triangle', octave: 1 },   // Orange - warm mid
            'ffd100': { type: 'sine', octave: 2 },       // Yellow - bright high chime
            'fafdff': { type: 'sine', octave: 3 },       // White - whisper high chime
            'ff80a4': { type: 'triangle', octave: 2 },   // Light pink - soft bell
            'ff2674': { type: 'sine', octave: 1.5 },     // Pink - mid chime
            '94216a': { type: 'triangle', octave: 0.75 },// Purple - sub
            '430067': { type: 'triangle', octave: 0.5 }, // Deep purp - heavy
            '234975': { type: 'triangle', octave: 0.75 },// Dark blue - mellow hum
            '68aed4': { type: 'sine', octave: 2 },       // Light blue - clear chime
            'bfff3c': { type: 'sine', octave: 2 },       // Lime - clear arpeggio
            '10d275': { type: 'triangle', octave: 1 },   // Green - woody tone
            '007899': { type: 'sine', octave: 1 },       // Teal - glass bell
            '002859': { type: 'triangle', octave: 0.5 }  // Navy - warm drone
        };

        // Fill grid
        // Force an 8x6 grid on desktop (or proportional 4x6 on mobile) for tighter visual spacing and less overload
        const cols = window.innerWidth < 768 ? 4 : 8;
        const rows = window.innerHeight < 768 ? 6 : 6;
        const numItems = cols * rows;  
        
        // Force foolproof perfect CSS Grid fit to window dimensions
        // With grid gaps added, using 1fr instead of viewport units allows CSS engine to correctly constrain items
        canvas.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
        canvas.style.gridTemplateRows = `repeat(${rows}, 1fr)`; 
        
        const runtimePalette = getShuffledPalette();
        
        for (let i = 0; i < numItems; i++) {
            
            // Pull a base hex code cyclically from the newly shuffled palette
            const baseColorHex = runtimePalette[i % runtimePalette.length];
            const uniqueShade = generateUniqueShade(baseColorHex);
            
            // Assign a specific synth profile based on the color's family
            const currentProfile = synthProfiles[baseColorHex] || {type: 'sine', octave: 1};
            
            // Explicitly tie the pitch to the color's position in the palette array so diverse colors = beautiful chords
            const colorIndex = basePalette.indexOf(baseColorHex);
            const scaleIndex = colorIndex !== -1 ? (colorIndex % scale.length) : Math.floor(Math.random() * scale.length);
            const chosenNote = scale[scaleIndex];
            
            // Assign this block a specific rhythm loop length (e.g. loops every 2 beats)
            const beatMulti = possibleBeatMultipliers[Math.floor(Math.random() * possibleBeatMultipliers.length)];
            const loopIntervalMs = beatDurationMs * beatMulti;
            // Ensure long, satisfying loops that gradually fade away
            const maxLoops = Math.max(10, Math.floor(16 / beatMulti)); 
            
            const item = document.createElement('div');
            item.className = 'grid-item';
            
            // Instead of an image, assign the random shade directly to the background
            item.style.backgroundColor = uniqueShade;
            
            let loopTimer = null;

            item.addEventListener('click', () => {
                initAudio();
                if (item.classList.contains('active')) return;

                item.classList.add('active');
                
                let loopCount = 0;
                
                // Self-contained function to elegantly settle this specific key back to sleep
                const settleDown = () => {
                    clearInterval(loopTimer);
                    if (!item.classList.contains('active')) return;
                    item.classList.remove('active');
                    item.style.transform = '';
                    item.style.filter = '';
                    
                    // Remove from tracking list if it exists
                    if (colorActiveKeys[baseColorHex]) {
                        const idx = colorActiveKeys[baseColorHex].findIndex(k => k.item === item);
                        if (idx !== -1) colorActiveKeys[baseColorHex].splice(idx, 1);
                    }
                };
                
                // Track this active key to enforce our chaos cap grouped by specific color
                if (!colorActiveKeys[baseColorHex]) {
                    colorActiveKeys[baseColorHex] = [];
                }
                colorActiveKeys[baseColorHex].push({ item, settleDown });
                
                // Truncate oldest pattern IF we exceed the max for this specific color
                if (colorActiveKeys[baseColorHex].length > MAX_PER_COLOR) {
                    const oldest = colorActiveKeys[baseColorHex].shift();
                    oldest.settleDown(); 
                }
                
                // The rhythmic step execution
                const triggerStep = () => {
                    playNote(chosenNote, currentProfile);
                    
                    // Visual thump mapping to the beat!
                    item.style.transform = 'scale(1.1)';
                    // We increase brightness to make the color pop when triggered
                    item.style.filter = 'brightness(1.5) drop-shadow(0 0 30px rgba(255,255,255,0.6))';
                    
                    // Settle back to active resting state
                    setTimeout(() => {
                        if (item.classList.contains('active')) {
                            item.style.transform = 'scale(1.03)';
                            item.style.filter = 'brightness(1.15) drop-shadow(0 0 15px rgba(255,255,255,0.2))';
                        }
                    }, 150); // fast visual decay
                    
                    loopCount++;
                    
                    // Auto settle-down off after finishing its loop phrase
                    if (loopCount >= maxLoops) {
                        settleDown();
                    }
                };

                // Play first step immediately and start interval sequence
                triggerStep();
                loopTimer = setInterval(triggerStep, loopIntervalMs);
            });
            
            canvas.appendChild(item);
        }

        // Track mouse/touch for the flashlight overlay
        function updateFlashlight(e) {
            let x, y;
            if (e.targetTouches && e.targetTouches.length > 0) {
                x = e.targetTouches[0].clientX;
                y = e.targetTouches[0].clientY;
            } else {
                x = e.clientX;
                y = e.clientY;
            }
            // Update CSS variables directly on the overlay
            requestAnimationFrame(() => {
                overlay.style.setProperty('--cursor-x', `${x}px`);
                overlay.style.setProperty('--cursor-y', `${y}px`);
            });
        }

        window.addEventListener('mousemove', updateFlashlight, {passive: true});
        window.addEventListener('touchmove', updateFlashlight, {passive: true});
        
        // Hide flashlight when cursor leaves window
        window.addEventListener('mouseout', (e) => {
            if (e.relatedTarget === null) {
               overlay.style.setProperty('--cursor-x', `-1000px`);
               overlay.style.setProperty('--cursor-y', `-1000px`);
            }
        });
        
        // Initialize flashlight off screen
        overlay.style.setProperty('--cursor-x', `-1000px`);
        overlay.style.setProperty('--cursor-y', `-1000px`);

    </script>
</body>
</html>
