<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discovery Sequencer</title>
    <!-- Use a modern sleek font for this specific exhibit -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/abstract.css">
</head>
<body>

    <div class="help-btn" id="help-btn" title="Information">?</div>
    <div class="info-panel" id="info-panel" style="opacity: 0; pointer-events: none; transition: opacity 0.3s ease;">
        <h1>Discovery Sequencer</h1>
        <p>Click patterns to start their rhythmic loops.</p>
        <p>Have fun playing!</p>
    </div>

    <!-- The overlay that creates the darkness and the flashlight hole -->
    <div id="flashlight-overlay"></div>

    <div id="discovery-canvas">
        <!-- Grid items generated by JS -->
    </div>

    <script>
        // Data for patterns
        const assetsBase = 'assets/pattern-vibes/';
        const patterns = [
            { id: 1, png: 'pattern_Mar25.png', gif: 'pattern_Mar25.gif' }, 
            { id: 2, png: 'trippy_pattern_mar25.png', gif: 'trippy_pattern_mar25.gif' },
            { id: 3, png: 'cooler_pattern_mar25.png', gif: 'electric_pattern_mar25.gif' } 
        ];
        
        // Pentatonic scale notes (C major pentatonic: C, D, E, G, A in various octaves for depth)
        const scale = [
            130.81, 146.83, 164.81, 196.00, 220.00, // C3 to A3
            261.63, 293.66, 329.63, 392.00, 440.00, // C4 to A4
            523.25, 587.33, 659.25                  // C5 to E5
        ];

        const canvas = document.getElementById('discovery-canvas');
        const overlay = document.getElementById('flashlight-overlay');
        
        // Audio Context (created on first interaction)
        let audioCtx;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playNote(frequency) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            // Mix of sine and triangle for a synth bell sound
            osc.type = Math.random() > 0.5 ? 'sine' : 'triangle'; 
            osc.frequency.value = frequency;

            // Envelope to make it sound like a chime/bell
            gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
            gainNode.gain.linearRampToValueAtTime(Math.random() * 0.2 + 0.1, audioCtx.currentTime + 0.05); // Attack
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 2.5); // Decay/Release

            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            osc.start();
            osc.stop(audioCtx.currentTime + 3);
        }

        // Help button logic
        const helpBtn = document.getElementById('help-btn');
        const infoPanel = document.getElementById('info-panel');
        helpBtn.addEventListener('click', () => {
            const isHidden = infoPanel.style.opacity === '0';
            infoPanel.style.opacity = isHidden ? '1' : '0';
            infoPanel.style.pointerEvents = isHidden ? 'auto' : 'none';
        });

        // Polyrhythmic Settings
        const BPM = 120;
        const beatDurationMs = (60 / BPM) * 1000; // 500ms
        const possibleBeatMultipliers = [1, 2, 3, 4]; // Loop lengths in beats
        
        // Prevent chaos: FIFO queue for active keys
        const MAX_ACTIVE_KEYS = 8;
        const activeKeysList = [];

        // Fill grid
        // Force an 11x8 grid on desktop (or proportional 6x10 on mobile)
        const cols = window.innerWidth < 768 ? 6 : 11;
        const rows = window.innerWidth < 768 ? 10 : 8;
        const numItems = cols * rows;  
        
        // Force foolproof perfect CSS Grid fit to window dimensions
        canvas.style.gridTemplateColumns = `repeat(${cols}, ${100/cols}vw)`;
        canvas.style.gridTemplateRows = `repeat(${rows}, ${100/rows}vh)`; 
        
        for (let i = 0; i < numItems; i++) {
            const row = Math.floor(i / cols);
            const col = i % cols;
            
            // Cluster the patterns based on grid position for "discovery"
            let patternIndex = 0;
            if (row < rows/2 && col < cols/2) patternIndex = 0;
            else if (row >= rows/2 && col < cols/2) patternIndex = 1;
            else patternIndex = 2;
            
            // Add slight randomness to blend the edges of clusters
            if (Math.random() < 0.25) {
                patternIndex = Math.floor(Math.random() * patterns.length);
            }
            
            const pattern = patterns[patternIndex];
            const randomNote = scale[Math.floor(Math.random() * scale.length)];
            
            // Assign this block a specific rhythm loop length (e.g. loops every 2 beats)
            const beatMulti = possibleBeatMultipliers[Math.floor(Math.random() * possibleBeatMultipliers.length)];
            const loopIntervalMs = beatDurationMs * beatMulti;
            const maxLoops = Math.max(10, Math.floor(16 / beatMulti)); // Ensure it plays enough times
            
            const item = document.createElement('div');
            item.className = 'grid-item';
            
            const img = document.createElement('img');
            img.src = assetsBase + pattern.png;
            img.dataset.png = assetsBase + pattern.png;
            img.dataset.gif = assetsBase + pattern.gif;
            
            // Random slight rotation or flip to break up perfect repetition
            const transformations = ['scaleX(-1)', 'scaleY(-1)', 'rotate(90deg)', 'rotate(180deg)', 'rotate(270deg)', 'none'];
            img.style.transform = transformations[Math.floor(Math.random() * transformations.length)];
            
            item.appendChild(img);
            
            let loopTimer = null;

            item.addEventListener('click', () => {
                initAudio();
                if (item.classList.contains('active')) return;

                item.classList.add('active');
                
                const cacheBuster = '?v=' + Date.now() + Math.random();
                img.src = img.dataset.gif + cacheBuster;
                
                let loopCount = 0;
                
                // Self-contained function to elegantly settle this specific key back to sleep
                const settleDown = () => {
                    clearInterval(loopTimer);
                    if (!item.classList.contains('active')) return;
                    item.classList.remove('active');
                    item.style.transform = '';
                    item.style.filter = '';
                    img.src = img.dataset.png;
                    
                    // Remove from tracking list if it exists
                    const idx = activeKeysList.findIndex(k => k.item === item);
                    if (idx !== -1) activeKeysList.splice(idx, 1);
                };
                
                // Track this active key to enforce our chaos cap
                activeKeysList.push({ item, settleDown });
                if (activeKeysList.length > MAX_ACTIVE_KEYS) {
                    const oldest = activeKeysList.shift();
                    oldest.settleDown(); // peacefully turn off the oldest!
                }
                
                // The rhythmic step execution
                const triggerStep = () => {
                    playNote(randomNote);
                    
                    // Visual thump mapping to the beat!
                    item.style.transform = 'scale(1.1)';
                    item.style.filter = 'brightness(1.5) drop-shadow(0 0 30px rgba(255,255,255,0.6))';
                    
                    // Settle back to active resting state
                    setTimeout(() => {
                        if (item.classList.contains('active')) {
                            item.style.transform = 'scale(1.03)';
                            item.style.filter = 'brightness(1.1) drop-shadow(0 0 15px rgba(255,100,150,0.3))';
                        }
                    }, 150); // fast visual decay
                    
                    loopCount++;
                    
                    // Auto settle-down off after finishing its loop phrase
                    if (loopCount >= maxLoops) {
                        settleDown();
                    }
                };

                // Play first step immediately and start interval sequence
                triggerStep();
                loopTimer = setInterval(triggerStep, loopIntervalMs);
            });
            
            canvas.appendChild(item);
        }

        // Track mouse/touch for the flashlight overlay
        function updateFlashlight(e) {
            let x, y;
            if (e.targetTouches && e.targetTouches.length > 0) {
                x = e.targetTouches[0].clientX;
                y = e.targetTouches[0].clientY;
            } else {
                x = e.clientX;
                y = e.clientY;
            }
            // Update CSS variables directly on the overlay
            requestAnimationFrame(() => {
                overlay.style.setProperty('--cursor-x', `${x}px`);
                overlay.style.setProperty('--cursor-y', `${y}px`);
            });
        }

        window.addEventListener('mousemove', updateFlashlight, {passive: true});
        window.addEventListener('touchmove', updateFlashlight, {passive: true});
        
        // Hide flashlight when cursor leaves window
        window.addEventListener('mouseout', (e) => {
            if (e.relatedTarget === null) {
               overlay.style.setProperty('--cursor-x', `-1000px`);
               overlay.style.setProperty('--cursor-y', `-1000px`);
            }
        });
        
        // Initialize flashlight off screen
        overlay.style.setProperty('--cursor-x', `-1000px`);
        overlay.style.setProperty('--cursor-y', `-1000px`);

    </script>
</body>
</html>
