<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Munir's Hobby Box</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/sunset.css">
</head>

<body class="landing-page" style="transition: color 1.5s ease; background-color: #f6c9d2;">
    <!-- Raw Image layer -->
    <div class="art-background" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; background-image: url('assets/pattern-vibes/cooler_pattern_mar25.png'); background-size: cover; background-position: center; pointer-events: none;"></div>
    
    <!-- Sunset tint layer, hidden initially -->
    <div id="sunset-tint" class="theme-sunset" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; background: var(--bg-image); mix-blend-mode: multiply; opacity: 0; transition: opacity 1.5s ease; pointer-events: none;"></div>
    <div class="screen-overlay"></div>
    <div class="container">
        <header class="header">
            <h1>Munir's Hobby Box</h1>
        </header>

        <nav class="nav-menu">
            <a href="https://munir-paviwala.github.io/musicProject" class="nav-link pixel-box">
                Music Project
            </a>
            <a href="music-tapes.html" class="nav-link pixel-box">
                Munir's Music Tapes
            </a>
            <a href="pixel-art.html" class="nav-link pixel-box">
                Pixel Art Collection
            </a>
            <a href="margins.html" class="nav-link pixel-box">
                The Margins (Daily Art & Doodles)
            </a>
            <a href="crush.html" class="nav-link pixel-box">
                The Aesthetics of Crush (Tessa Violet)
            </a>
            <a href="abstract.html" class="nav-link pixel-box">
                Discovery Sequencer: Abstract Art
            </a>
        </nav>

        <footer class="footer">
            <p>&copy; 2026 Munir Paviwala</p>
            <div class="credit-box" style="margin-top: 10px; font-size: 0.55rem; color: var(--text-secondary); background: rgba(255, 255, 255, 0.4); padding: 5px 10px; border-radius: 4px; display: inline-block;">Background art designed by Munir Paviwala</div>
        </footer>
    </div>

    <script>
        // The secret code
        const secretCode = "hello";
        let inputBuffer = "";

        const container = document.querySelector('.container');
        // Hide by default with a smooth fade in
        container.style.opacity = '0';
        container.style.pointerEvents = 'none';
        container.style.transition = 'opacity 1.5s ease';

        function unlock() {
            container.style.opacity = '1';
            container.style.pointerEvents = 'auto';
            document.body.classList.add('theme-sunset');
            document.getElementById('sunset-tint').style.opacity = '0.5';
        }

        // Desktop: Keyboard listener for "konami" style code
        window.addEventListener('keydown', (e) => {
            // only track characters
            if (e.key.length === 1) {
                inputBuffer += e.key.toLowerCase();
                // Keep buffer length to secretCode length
                if (inputBuffer.length > secretCode.length) {
                    inputBuffer = inputBuffer.substring(inputBuffer.length - secretCode.length);
                }
                if (inputBuffer === secretCode) {
                    unlock();
                }
            }
        });

        // Mobile: 5 quick taps anywhere on the screen
        let tapCount = 0;
        let tapTimeout;
        window.addEventListener('touchstart', (e) => {
            // Only count taps if container is hidden
            if (container.style.opacity === '0') {
                tapCount++;
                clearTimeout(tapTimeout);
                if (tapCount >= 5) {
                    unlock();
                    tapCount = 0;
                }
                tapTimeout = setTimeout(() => {
                    tapCount = 0;
                }, 600); // 600ms timeframe to keep tapping
            }
        });
    </script>
</body>

</html>
