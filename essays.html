    <script>
        const secretCode = "hello";
        let inputBuffer = "";
        let isEditorEnabled = false;

        // --- Secret Key Listener ---
        window.addEventListener('keydown', (e) => {
            if (isEditorEnabled) return;
            if (e.key.length === 1) {
                inputBuffer += e.key.toLowerCase();
                if (inputBuffer.length > secretCode.length) {
                    inputBuffer = inputBuffer.substring(inputBuffer.length - secretCode.length);
                }
                if (inputBuffer === secretCode) {
                    enableEditor();
                }
            }
        });

        function enableEditor() {
            isEditorEnabled = true;
            document.body.classList.add('editor-active');
            const content = document.getElementById('essay-content');
            content.contentEditable = "true";
            content.focus();

            document.getElementById('editor-status').style.display = 'flex';
            console.log("Editor Mode Enabled.");
        }

        // --- Selection Toolbar Logic ---
        const toolbar = document.getElementById('selection-toolbar');
        document.addEventListener('selectionchange', () => {
            if (!isEditorEnabled) return;
            const selection = window.getSelection();
            if (selection.toString().length > 0) {
                const range = selection.getRangeAt(0);
                const rect = range.getBoundingClientRect();
                toolbar.style.display = 'flex';
                toolbar.style.top = `${rect.top - 40 + window.scrollY}px`;
                toolbar.style.left = `${rect.left + rect.width / 2}px`;
            } else {
                toolbar.style.display = 'none';
            }
        });

        function insertLinkMD() {
            const selection = window.getSelection();
            const text = selection.toString() || "link text";
            document.execCommand('insertHTML', false, `[${text}]()`);
            const newSelection = window.getSelection();
            const range = newSelection.getRangeAt(0);
            range.setStart(range.startContainer, range.startOffset - 1);
            range.collapse(true);
            newSelection.removeAllRanges();
            newSelection.addRange(range);
        }

        // --- Slash Palette Logic ---
        const palette = document.getElementById('slash-palette');
        const paletteList = document.getElementById('palette-options');
        const paletteInput = document.getElementById('palette-input');
        const paletteInputWrapper = document.getElementById('palette-input-wrapper');

        const commands = [
            { id: 'h1', label: 'heading 1', action: () => document.execCommand('formatBlock', false, 'h1') },
            { id: 'h2', label: 'heading 2', action: () => document.execCommand('formatBlock', false, 'h2') },
            { id: 'bullet', label: 'bullet list', action: () => document.execCommand('insertUnorderedList', false, null) },
            { id: 'quote', label: 'quote', action: () => document.execCommand('formatBlock', false, 'blockquote') },
            { id: 'fn', label: 'footnote', action: () => openPaletteInput('fn', 'num:content') },
            { id: 'link', label: 'link', action: () => insertLinkMD() },
            { id: 'img', label: 'image', action: () => triggerImageUpload() },
            { id: 'art', label: 'art/video', action: () => openPaletteInput('art', 'url') }
        ];

        let activeIndex = 0;
        let isPaletteOpen = false;

        document.getElementById('essay-content').addEventListener('keydown', (e) => {
            if (!isEditorEnabled) return;

            if (e.key === '/') {
                const selection = window.getSelection();
                const range = selection.getRangeAt(0);
                if (range.startOffset === 0 || selection.anchorNode.textContent.charAt(range.startOffset - 1) === ' ' || selection.anchorNode.textContent.charAt(range.startOffset - 1) === '\n') {
                    // Small delay to ensure coordinates are updated
                    setTimeout(showPalette, 10);
                }
            }

            if (isPaletteOpen) {
                // Existing palette keyboard nav...
                if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    activeIndex = (activeIndex + 1) % commands.length;
                    renderPaletteOptions();
                } else if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    activeIndex = (activeIndex - 1 + commands.length) % commands.length;
                    renderPaletteOptions();
                } else if (e.key === 'Enter') {
                    e.preventDefault();
                    executeCommand(commands[activeIndex]);
                } else if (e.key === 'Escape') {
                    hidePalette();
                }
            }

            // Shortcuts
            if (e.altKey || e.ctrlKey) {
                if (e.code === 'Digit1') { e.preventDefault(); document.execCommand('formatBlock', false, 'h1'); }
                if (e.code === 'Digit2') { e.preventDefault(); document.execCommand('formatBlock', false, 'h2'); }
            }

            // Markdown-style linked conversion
            if (e.key === ')') {
                setTimeout(() => {
                    const selection = window.getSelection();
                    const node = selection.anchorNode;
                    const text = node.textContent;
                    const offset = selection.anchorOffset;
                    if (node.nodeType === 3) {
                        const match = text.substring(0, offset).match(/\[([^\]]+)\]\(([^)]+)\)$/);
                        if (match) {
                            const fullMatch = match[0];
                            const linkText = match[1];
                            const linkUrl = match[2];
                            const range = document.createRange();
                            range.setStart(node, offset - fullMatch.length);
                            range.setEnd(node, offset);
                            range.deleteContents();
                            const a = document.createElement('a');
                            a.href = linkUrl;
                            a.innerText = linkText;
                            a.target = "_blank";
                            range.insertNode(a);
                            selection.collapse(a.nextSibling || a.parentNode, 1);
                        }
                    }
                }, 10);
            }
        });

        function showPalette() {
            const selection = window.getSelection();
            if (selection.rangeCount === 0) return;
            const range = selection.getRangeAt(0);
            const rect = range.getBoundingClientRect();

            isPaletteOpen = true;
            palette.style.display = 'block';
            // Snap perfectly under the line being written
            palette.style.top = `${rect.bottom + window.scrollY}px`;
            palette.style.left = `${rect.left}px`;

            paletteList.style.display = 'block';
            if (paletteInputWrapper) paletteInputWrapper.style.display = 'none';
            renderPaletteOptions();
        }

        function renderPaletteOptions() {
            paletteList.innerHTML = '';
            commands.forEach((cmd, idx) => {
                const el = document.createElement('div');
                el.className = `palette-item ${idx === activeIndex ? 'active' : ''}`;
                el.innerText = `> ${cmd.label}`;
                el.onmousedown = (e) => { e.preventDefault(); executeCommand(cmd); };
                paletteList.appendChild(el);
            });
        }

        function executeCommand(cmd) {
            if (cmd.id === 'fn' || cmd.id === 'link' || cmd.id === 'art') {
                cmd.action();
            } else {
                // For direct commands, delete the '/' and go
                document.execCommand('delete', false, null);
                cmd.action();
                hidePalette();
            }
        }

        function hidePalette() {
            palette.style.display = 'none';
            isPaletteOpen = false;
            activeIndex = 0;
            const content = document.getElementById('essay-content');
            content.focus();
        }

        // Terminal Prompt Input
        let currentInputType = '';
        function openPaletteInput(type, promptText) {
            currentInputType = type;
            paletteList.style.display = 'none';
            paletteInputWrapper.style.display = 'block';
            document.getElementById('palette-prompt').innerText = `> ${promptText}: `;
            paletteInput.value = '';
            setTimeout(() => paletteInput.focus(), 10);
        }

        paletteInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                handlePaletteSubmit(paletteInput.value);
            } else if (e.key === 'Escape') {
                hidePalette();
            }
        });

        function handlePaletteSubmit(val) {
            document.getElementById('essay-content').focus();
            document.execCommand('delete', false, null);

            if (currentInputType === 'fn') {
                const parts = val.split(':');
                const num = parts[0].trim();
                const content = parts.length > 1 ? parts[1].trim() : val;
                const html = `<a href="#footnote-${num}" class="footnote-ref" data-content="${content}" id="ref-${num}">[${num}]</a>`;
                document.execCommand('insertHTML', false, html);

                const list = document.getElementById('footnotes-list');
                if (list) {
                    const p = document.createElement('p');
                    p.id = `footnote-${num}`;
                    p.innerHTML = `[${num}] ${content}`;
                    list.appendChild(p);
                }
                toggleSideRail(true);
            } else if (currentInputType === 'art') {
                document.execCommand('insertHTML', false, `<div class="art-piece"><iframe src="${val}"></iframe></div><p><br></p>`);
            }
            hidePalette();
        }

        // --- Image Support ---
        function triggerImageUpload() {
            document.body.insertAdjacentHTML('beforeend', '<input type="file" id="temp-upload" style="display:none" accept="image/*">');
            const input = document.getElementById('temp-upload');
            input.onchange = (e) => {
                const file = e.target.files[0];
                handleImageFile(file);
                input.remove();
                hidePalette();
            };
            input.click();
        }

        function handleImageFile(file) {
            if (!file) return;
            const limit = 500 * 1024;
            const reader = new FileReader();
            reader.onload = (event) => {
                const imgHTML = file.size > limit ?
                    `<div class="art-piece"><img src="assets/essay-images/art_${Math.random().toString(36).substring(7)}.png" alt="Art"></div>` :
                    `<div class="art-piece"><img src="${event.target.result}" alt="Art"></div>`;

                if (file.size > limit) {
                    const randomName = 'art_' + Math.random().toString(36).substring(7) + '.png';
                    const link = document.createElement('a');
                    link.href = event.target.result;
                    link.download = randomName;
                    link.click();
                    alert(`IMAGE TOO LARGE (>500KB). Save to 'assets/essay-images/' as: ${randomName}`);
                }
                document.execCommand('insertHTML', false, imgHTML);
            };
            reader.readAsDataURL(file);
        }

        document.getElementById('essay-content').addEventListener('paste', (e) => {
            if (!isEditorEnabled) return;
            const items = (e.clipboardData || e.originalEvent.clipboardData).items;
            for (const item of items) {
                if (item.type.indexOf("image") !== -1) {
                    handleImageFile(item.getAsFile());
                }
            }
        });

        // --- UI Interactions ---
        function toggleSideRail(show) {
            const rail = document.getElementById('side-rail');
            if (show) rail.classList.add('visible');
            else rail.classList.remove('visible');
        }

        document.getElementById('essay-content').addEventListener('mouseover', (e) => {
            if (e.target.classList.contains('footnote-ref')) toggleSideRail(true);
        });

        function toggleTheme() {
            const body = document.body;
            body.setAttribute('data-theme', body.getAttribute('data-theme') === 'light' ? 'dark' : 'light');
        }

        function exitEditor() {
            if (confirm("Exit Writer Mode? Unsaved work will be lost.")) location.reload();
        }

        function downloadHTML() {
            window.getSelection().removeAllRanges();
            const docClone = document.documentElement.cloneNode(true);
            const cleaners = ['#editor-status', '#slash-palette', '#selection-toolbar', '#theme-switch', '#temp-upload'];
            cleaners.forEach(s => { const el = docClone.querySelector(s); if (el) el.remove(); });

            const content = docClone.querySelector('#essay-content');
            if (content) { content.contentEditable = "false"; content.removeAttribute('spellcheck'); }

            const rail = docClone.querySelector('#side-rail');
            if (rail) rail.classList.remove('visible');

            const script = docClone.querySelector('script');
            if (script) script.textContent = script.textContent.replace('let isEditorEnabled = false;', 'let isEditorEnabled = false;');

            const blob = new Blob(["<!DOCTYPE html>\n" + docClone.outerHTML], { type: 'text/html' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'essays.html';
            a.click();
        }
    </script>

        style="border-width: medium; border-style: none; border-color: currentcolor; border-image: initial; padding: 0px; margin: 0px; inset: 0px; position: fixed; width: 100vw; height: 100vh; background: transparent; pointer-events: none;">
    </div>
