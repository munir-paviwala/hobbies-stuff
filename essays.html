<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Art Musings | Munir's Hobbies Box</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;700&amp;display=swap" rel="stylesheet">
    <style id="main-styles">
        :root {
            --bg-color: #fdfcf8;
            --text-primary: #121212;
            --text-secondary: #666;
            --accent-blue: #708bd4;
            --accent-pink: #ff6b81;
            --brand-purple: #90306c;
            --editor-highlight: rgba(112, 139, 212, 0.1);
            --font-mono: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
            --border-color: #ddd;
            --blockquote-bg: rgba(112, 139, 212, 0.05);
            --btn-text: #121212;
        }

        [data-theme="dark"] {
            --bg-color: #121212;
            --text-primary: #e0e0e0;
            --text-secondary: #aaa;
            --accent-blue: #8ba4e9;
            --border-color: #333;
            --blockquote-bg: rgba(255, 255, 255, 0.05);
            --editor-highlight: rgba(255, 255, 255, 0.05);
            --btn-text: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: var(--font-mono);
            line-height: 1.6;
            overflow-x: hidden;
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        .workspace {
            display: flex;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        .container-wrapper {
            flex: 1;
            overflow-y: auto;
            scroll-snap-type: y mandatory;
            scroll-behavior: smooth;
            background: var(--bg-color);
        }

        .container {
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
        }

        .slide {
            min-height: 100vh;
            width: 100%;
            scroll-snap-align: start;
            display: flex;
            flex-direction: column;
            padding: 10vh 2rem;
            box-sizing: border-box;
            transition: background 0.5s ease, color 0.5s ease;
            border-bottom: 1px dashed var(--border-color);
        }

        .slide[data-align="center"] { text-align: center; align-items: center; }
        .slide[data-align="right"] { text-align: right; align-items: flex-end; }
        .slide[data-align="left"] { text-align: left; align-items: flex-start; }

        .slide[data-slide-theme="dark"] {
            background: #111 !important;
            color: #f0f0f0 !important;
            --border-color: #333;
        }

        .slide-break {
            height: 0;
            margin: 0;
            border: none;
            visibility: hidden;
            scroll-snap-align: start;
        }

        h1 { font-size: 2.2rem; margin-bottom: 2rem; }
        h2 { font-size: 1.5rem; margin-top: 2rem; margin-bottom: 1rem; }
        p { margin-bottom: 1.2rem; }

        .side-rail {
            width: 300px;
            border-left: 1px solid var(--border-color);
            padding: 20px;
            background: var(--bg-color);
            position: fixed;
            right: -300px;
            top: 0;
            bottom: 0;
            transition: right 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 100;
        }

        .side-rail.visible {
            right: 0;
            position: relative;
            right: auto;
        }

        .slash-palette {
            position: absolute;
            background: var(--bg-color);
            border: 1px solid var(--text-primary);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            min-width: 250px;
            z-index: 2000;
            display: none;
            font-size: 0.9rem;
        }

        .palette-list { padding: 5px 0; }
        .palette-item { padding: 8px 15px; cursor: pointer; transition: background 0.2s; }
        .palette-item.active, .palette-item:hover { background: var(--text-primary); color: var(--bg-color); }

        #palette-input-wrapper { padding: 10px 15px; border-top: 1px solid var(--border-color); display: flex; align-items: center; }
        #palette-input { background: transparent; border: none; color: var(--text-primary); font-family: var(--font-mono); outline: none; flex: 1; }

        .selection-toolbar {
            position: absolute;
            background: var(--text-primary);
            color: var(--bg-color);
            padding: 5px;
            border-radius: 4px;
            display: none;
            gap: 5px;
            z-index: 1500;
            transform: translate(-50%, -100%);
        }

        .selection-toolbar button {
            background: transparent;
            border: none;
            color: inherit;
            padding: 5px 10px;
            cursor: pointer;
            font-weight: bold;
        }

        .selection-toolbar button:hover { background: rgba(255, 255, 255, 0.1); }

        #theme-switch {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            border: 1px solid var(--text-primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            background: transparent;
            z-index: 2001;
            transition: all 0.3s ease, opacity 0.5s ease;
            opacity: 0;
        }

        #theme-switch:hover { transform: rotate(180deg); }
        body:hover #theme-switch, body:hover .nav-back { opacity: 1; }
        #theme-switch::before { content: '◑'; font-size: 1.2rem; color: var(--text-primary); }

        .nav-back {
            position: fixed;
            top: 20px;
            left: 20px;
            text-decoration: none;
            color: var(--text-secondary);
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 1000;
            transition: opacity 0.5s ease;
            opacity: 0;
        }

        #editor-status {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: var(--text-primary);
            color: var(--bg-color);
            padding: 8px 30px;
            font-size: 0.75rem;
            display: none; /* Hidden until unlock */
            gap: 25px;
            align-items: center;
            justify-content: center;
            z-index: 5000;
            border-top: 2px solid var(--brand-purple);
            box-shadow: 0 -5px 15px rgba(144, 48, 108, 0.3);
        }

        #editor-status.visible { display: flex; }

        .slide-mark {
            border-top: 1px dashed var(--brand-purple);
            margin: 60px auto;
            padding: 20px 0;
            text-align: center;
            color: var(--brand-purple);
            font-size: 0.8rem;
            opacity: 0.8;
            width: 100%;
            pointer-events: none;
            font-style: italic;
            user-select: none;
        }

        #editor-status button {
            background: transparent;
            border: 1px solid var(--bg-color);
            color: var(--bg-color);
            padding: 4px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s ease;
        }

        #editor-status button:hover { background: var(--bg-color); color: var(--text-primary); }

        .art-piece iframe, .art-piece img, .container img {
            width: 100%;
            max-width: 800px;
            height: auto;
            max-height: 500px;
            object-fit: contain;
            border: 1px solid var(--border-color);
            margin: 1rem 0;
            display: block;
        }

        /* Mobile Optimizations */
        @media (max-width: 768px) {
            .container-wrapper {
                scroll-snap-type: y proximity; /* More forgiving for long pages */
            }

            .slide {
                padding: 12vh 1.5rem 5vh 1.5rem;
                min-height: auto; /* Allow growth if content is long */
                height: auto;
            }

            h1 { font-size: 1.8rem; line-height: 1.2; margin-bottom: 1.5rem; word-break: break-word; }
            h2 { font-size: 1.3rem; }
            p { font-size: 1rem; }

            #theme-switch, .nav-back {
                opacity: 0.8;
                background: var(--bg-color);
                box-shadow: 0 5px 15px rgba(0,0,0,0.1);
                padding: 10px;
                border-radius: 8px;
            }

            #theme-switch { width: 44px; height: 44px; top: 15px; right: 15px; }
            .nav-back { top: 15px; left: 15px; }

            #editor-status {
                flex-wrap: wrap;
                padding: 15px;
                gap: 10px;
                font-size: 0.7rem;
            }

            .selection-toolbar {
                transform: translate(-50%, -120%) scale(1.2); /* Bigger buttons for fingers */
            }
        }

        .art-modal {
            display: none;
            position: fixed;
            z-index: 6000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(5px);
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: var(--bg-color);
            border: 2px solid var(--text-primary);
            padding: 30px;
            max-width: 400px;
            width: 90%;
            box-shadow: 10px 10px 0 var(--brand-purple);
        }

        .modal-input {
            width: 100%;
            padding: 12px;
            margin: 20px 0;
            background: transparent;
            border: 1px solid var(--text-primary);
            color: var(--text-primary);
            font-family: var(--font-mono);
            outline: none;
        }

        .modal-actions { display: flex; gap: 15px; justify-content: flex-end; }

        .modal-btn {
            padding: 10px 20px;
            font-family: var(--font-mono);
            cursor: pointer;
            border: 1px solid var(--text-primary);
            background: var(--text-primary);
            color: var(--bg-color);
        }

        .modal-btn.secondary { background: transparent; color: var(--text-primary); }
        .modal-btn:hover { filter: invert(1); }
    </style>
</head>

<body data-theme="light">
    <a href="index.html" class="nav-back">← Back to World</a>
    <div id="theme-switch" onclick="toggleTheme()"></div>

    <!-- Command Palette -->
    <div id="slash-palette" class="slash-palette">
        <div id="palette-list" class="palette-list"></div>
        <div id="palette-input-wrapper" style="display:none">
            <span id="palette-prompt">></span>
            <input type="text" id="palette-input" spellcheck="false" autocomplete="off">
        </div>
    </div>

    <!-- Selection Toolbar -->
    <div id="selection-toolbar" class="selection-toolbar">
        <button id="btn-bold" title="Bold">B</button>
        <button id="btn-italic" title="Italic">I</button>
        <button id="btn-link" title="Link">🔗</button>
        <div class="toolbar-divider"></div>
        <button id="btn-align-left" title="Align Left">≡L</button>
        <button id="btn-align-center" title="Align Center">≡C</button>
        <button id="btn-align-right" title="Align Right">≡R</button>
    </div>

    <div id="footnote-rail" class="side-rail">
        <div class="side-rail-header">Footnotes</div>
        <div id="footnotes-list"></div>
    </div>

    <div id="editor-status">
        <span style="opacity: 0.6">Writer Mode Active</span>
        <div class="toolbar-divider"></div>
        <button onclick="insertPageBreak()">+ Add Page Break</button>
        <button onclick="downloadHTML()">Save (HTML)</button>
        <button onclick="exitEditor()" style="border-color: #ff4d4d; color: #ff4d4d">Exit</button>
    </div>

    <div class="workspace">
        <div class="container-wrapper">
            <div class="container" id="essay-content" contenteditable="false">
                <div class="slide" data-theme="light">
                    <h1 id="essay-title">Why this website is ART</h1>
                    <p>Start writing here...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Custom Modal System -->
    <div id="art-modal" class="art-modal">
        <div class="modal-content">
            <h3 id="modal-title">Enter Text</h3>
            <input type="text" id="modal-input" class="modal-input" spellcheck="false">
            <div class="modal-actions">
                <button id="modal-cancel" class="modal-btn secondary">Cancel</button>
                <button id="modal-ok" class="modal-btn">OK</button>
            </div>
        </div>
    </div>

    <script>
        let isEditorEnabled = false;
        let isPaletteOpen = false;
        let activeIndex = 0;

        const content = document.getElementById('essay-content');
        const palette = document.getElementById('slash-palette');
        const paletteList = document.getElementById('palette-list');
        const paletteInput = document.getElementById('palette-input');
        const paletteInputWrapper = document.getElementById('palette-input-wrapper');
        const toolbar = document.getElementById('selection-toolbar');

        // --- Commands ---
        const commands = [
            { id: 'h1', label: 'Heading 1', action: () => format('formatBlock', 'H1') },
            { id: 'h2', label: 'Heading 2', action: () => format('formatBlock', 'H2') },
            { id: 'p', label: 'Normal Text', action: () => format('formatBlock', 'P') },
            { id: 'ul', label: 'Bullet List', action: () => format('insertUnorderedList') },
            { id: 'img', label: 'Insert Image', action: () => triggerImageUpload() },
            { id: 'iframe', label: 'Insert Iframe (Embed)', action: () => openModal("Enter Iframe URL", url => format('insertHTML', `<div class="art-piece"><iframe src="${url}" style="width:100%; height:400px; border:none;"></iframe></div>`)) },
            { id: 'slide', label: 'Page Break', action: () => insertPageBreak() },
            { id: 'fn', label: 'Add Footnote', action: () => openModal("Enter footnote number:content (e.g. 1:Interesting fact)", val => handleFootnote(val)) }
        ];

        function format(cmd, val = null) {
            document.execCommand(cmd, false, val);
        }

        // --- Editor Unlock ---
        let keyBuffer = '';
        document.addEventListener('keypress', (e) => {
            if (isEditorEnabled) return;
            keyBuffer += e.key.toLowerCase();
            if (keyBuffer.endsWith('hello')) {
                openModal("Access Code Required:", pass => {
                    if (pass === 'art') {
                        enableEditor();
                    } else {
                        keyBuffer = '';
                        alert("Access Denied.");
                    }
                }, 'password');
                keyBuffer = '';
            }
            if (keyBuffer.length > 20) keyBuffer = keyBuffer.substring(10);
        });

        function enableEditor() {
            isEditorEnabled = true;
            document.body.classList.add('editor-active');
            document.getElementById('editor-status').classList.add('visible');
            content.contentEditable = "true";
            flattenSlides();
            content.focus();
        }

        function flattenSlides() {
            const slides = content.querySelectorAll('.slide');
            const newContent = document.createDocumentFragment();
            slides.forEach((slide, idx) => {
                while (slide.firstChild) {
                    newContent.appendChild(slide.firstChild);
                }
                if (idx < slides.length - 1) {
                    insertPageBreak(newContent);
                }
            });
            content.innerHTML = '';
            content.appendChild(newContent);
        }

        function insertPageBreak(target = null) {
            const breakEl = document.createElement('div');
            breakEl.className = 'slide-mark';
            breakEl.innerText = '--- Page Break ---';
            breakEl.contentEditable = "false";
            if (target && target.appendChild) {
                target.appendChild(breakEl);
            } else {
                const selection = window.getSelection();
                if (selection.rangeCount > 0) {
                    const range = selection.getRangeAt(0);
                    range.insertNode(breakEl);
                    const p = document.createElement('p');
                    p.innerHTML = '<br>';
                    breakEl.after(p);
                    range.setStartAfter(p);
                    range.setEndAfter(p);
                }
            }
        }

        // --- Palette Logic ---
        content.addEventListener('keyup', (e) => {
            if (!isEditorEnabled) return;
            if (e.key === '/') showPalette();
            else if (isPaletteOpen && e.key === 'ArrowDown') moveSelection(1);
            else if (isPaletteOpen && e.key === 'ArrowUp') moveSelection(-1);
            else if (isPaletteOpen && e.key === 'Enter') {
                e.preventDefault();
                executeCommand(commands[activeIndex]);
            } else if (e.key === 'Escape') hidePalette();
        });

        function showPalette() {
            const selection = window.getSelection();
            if (selection.rangeCount === 0) return;
            const range = selection.getRangeAt(0);
            const rect = range.getBoundingClientRect();
            isPaletteOpen = true;
            palette.style.display = 'block';
            palette.style.top = `${rect.bottom + window.scrollY}px`;
            palette.style.left = `${rect.left}px`;
            renderPalette();
        }

        function renderPalette() {
            paletteList.innerHTML = '';
            commands.forEach((cmd, i) => {
                const div = document.createElement('div');
                div.className = `palette-item ${i === activeIndex ? 'active' : ''}`;
                div.innerText = `> ${cmd.label}`;
                div.onmousedown = (e) => { e.preventDefault(); executeCommand(cmd); };
                paletteList.appendChild(div);
            });
        }

        function moveSelection(dir) {
            activeIndex = (activeIndex + dir + commands.length) % commands.length;
            renderPalette();
        }

        function executeCommand(cmd) {
            document.execCommand('delete', false, null); // remove the '/'
            cmd.action();
            hidePalette();
        }

        function hidePalette() {
            palette.style.display = 'none';
            isPaletteOpen = false;
            activeIndex = 0;
        }

        // --- Selection Toolbar ---
        document.addEventListener('selectionchange', () => {
            if (!isEditorEnabled) return;
            const sel = window.getSelection();
            if (sel.isCollapsed || sel.toString().trim().length === 0) {
                toolbar.style.display = 'none';
                return;
            }
            const range = sel.getRangeAt(0);
            const rect = range.getBoundingClientRect();
            toolbar.style.display = 'flex';
            toolbar.style.top = `${rect.top + window.scrollY - 10}px`;
            toolbar.style.left = `${rect.left + rect.width / 2}px`;
        });

        document.getElementById('btn-bold').onmousedown = e => { e.preventDefault(); format('bold'); };
        document.getElementById('btn-italic').onmousedown = e => { e.preventDefault(); format('italic'); };
        document.getElementById('btn-link').onmousedown = e => { e.preventDefault(); openModal("Enter URL", url => format('createLink', url)); };
        document.getElementById('btn-align-left').onmousedown = e => { e.preventDefault(); format('justifyLeft'); };
        document.getElementById('btn-align-center').onmousedown = e => { e.preventDefault(); format('justifyCenter'); };
        document.getElementById('btn-align-right').onmousedown = e => { e.preventDefault(); format('justifyRight'); };

        // --- Modals ---
        let modalCallback = null;
        function openModal(title, callback, type = 'text') {
            modalCallback = callback;
            document.getElementById('modal-title').innerText = title;
            const input = document.getElementById('modal-input');
            input.value = '';
            input.type = type;
            document.getElementById('art-modal').style.display = 'flex';
            input.focus();
        }

        document.getElementById('modal-input').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                document.getElementById('modal-ok').click();
            } else if (e.key === 'Escape') {
                closeModal();
            }
        });

        document.getElementById('modal-ok').onclick = () => {
            if (modalCallback) modalCallback(document.getElementById('modal-input').value);
            closeModal();
        };

        document.getElementById('modal-cancel').onclick = closeModal;
        function closeModal() {
            document.getElementById('art-modal').style.display = 'none';
            modalCallback = null;
        }

        function handleFootnote(val) {
            const parts = val.split(':');
            const num = parts[0].trim();
            const content = parts.length > 1 ? parts[1].trim() : val;
            format('insertHTML', `<a href="#footnote-${num}" class="footnote-ref" data-content="${content}">[${num}]</a>`);
            const flowEntry = document.createElement('div');
            flowEntry.innerHTML = `[${num}] ${content}`;
            document.getElementById('footnotes-list').appendChild(flowEntry);
        }

        function triggerImageUpload() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/*';
            input.onchange = e => {
                const file = e.target.files[0];
                const reader = new FileReader();
                reader.onload = rev => format('insertHTML', `<img src="${rev.target.result}" style="max-width:100%">`);
                reader.readAsDataURL(file);
            };
            input.click();
        }

        function toggleTheme() {
            const body = document.body;
            body.setAttribute('data-theme', body.getAttribute('data-theme') === 'light' ? 'dark' : 'light');
        }

        function exitEditor() {
            if (confirm("Exit Writer Mode? Unsaved work will be lost.")) location.reload();
        }

        function downloadHTML() {
            // First, rebuild slides
            const tempContainer = document.createElement('div');
            tempContainer.innerHTML = content.innerHTML;
            const slidesContainer = document.createElement('div');
            slidesContainer.className = 'container';

            let currentSlide = document.createElement('div');
            currentSlide.className = 'slide';

            Array.from(tempContainer.childNodes).forEach(node => {
                if (node.classList && node.classList.contains('slide-mark')) {
                    slidesContainer.appendChild(currentSlide);
                    currentSlide = document.createElement('div');
                    currentSlide.className = 'slide';
                } else {
                    currentSlide.appendChild(node.cloneNode(true));
                }
            });
            slidesContainer.appendChild(currentSlide);

            const docClone = document.documentElement.cloneNode(true);
            const cloneBody = docClone.querySelector('body');
            
            // Replace flow content with rebuilt slides
            docClone.querySelector('#essay-content').innerHTML = slidesContainer.innerHTML;
            docClone.querySelector('#essay-content').contentEditable = "false";
            
            // Cleanup UI
            const cleaners = ['#editor-status', '#slash-palette', '#selection-toolbar', '.nav-back', '#theme-switch', '.art-modal'];
            cleaners.forEach(s => { const el = docClone.querySelector(s); if (el) el.remove(); });
            
            cloneBody.classList.remove('editor-active');
            
            // Ensure editor state is disabled in the saved file's script
            const script = docClone.querySelector('script');
            if (script) script.textContent = script.textContent.replace('let isEditorEnabled = false;', 'let isEditorEnabled = false;');
            
            const blob = new Blob(["<!DOCTYPE html>\n" + docClone.outerHTML], { type: 'text/html' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'essays.html';
            a.click();
        }

        // Mobile Unlock: 5 quick taps
        let tapCount = 0;
        let tapTimeout;
        document.addEventListener('touchstart', (e) => {
            if (isEditorEnabled) return;
            tapCount++;
            clearTimeout(tapTimeout);
            if (tapCount >= 5) {
                openModal("Access Code Required:", pass => {
                    if (pass === 'art') enableEditor();
                    else tapCount = 0;
                }, 'password');
                tapCount = 0;
            }
            tapTimeout = setTimeout(() => { tapCount = 0; }, 1000);
        });
    </script>
</body>

</html>
